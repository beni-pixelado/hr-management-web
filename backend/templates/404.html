<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="icon" type="image/png" href="/static/favicon.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found | HR System</title>
    <link rel="stylesheet" href="/css/reports.css">
    <style>
        .main-content {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .error-wrap {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            max-width: 460px;
            padding: 30px 0;
        }

        .error-code {
            font-size: clamp(4rem, 12vw, 7rem);
            font-weight: 800;
            letter-spacing: -0.04em;
            line-height: 1;
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            color: var(--primary);
        }

        .error-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 88px;
            height: 88px;
            margin-bottom: 18px;
            border: 2px dashed var(--primary);
            border-radius: 50%;
            background: var(--primary-tint);
            box-shadow: 0 10px 24px var(--primary-glow);
        }

        .compass {
            width: 64px;
            height: 64px;
        }

        .compass-needle {
            transform-origin: 24px 24px;
            animation: compass-shake 2.6s ease-in-out infinite;
        }

        @keyframes compass-shake {
            0% { transform: rotate(-45deg); }
            10% { transform: rotate(20deg); }
            20% { transform: rotate(-38deg); }
            30% { transform: rotate(30deg); }
            40% { transform: rotate(-10deg); }
            50% { transform: rotate(-35deg); }
            60% { transform: rotate(25deg); }
            70% { transform: rotate(-42deg); }
            80% { transform: rotate(15deg); }
            90% { transform: rotate(-30deg); }
            100% { transform: rotate(-45deg); }
        }

        .error-title {
            margin: 8px 0 10px;
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--primary-strong);
            letter-spacing: -0.02em;
        }

        .error-desc {
            margin: 0 0 26px;
            font-size: 0.92rem;
            font-weight: 600;
            color: var(--muted);
            line-height: 1.7;
        }

        .error-actions {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
        }
    </style>
</head>

<body>
    <div class="window">
        <div class="window-header">
            <div>
                <div class="eyebrow">HR Management</div>
                <div class="window-title">Page Not Found</div>
            </div>
            <div class="window-status">Error 404</div>
            <div class="window-controls">
                <div class="window-control"></div>
                <div class="window-control"></div>
                <div class="window-control"></div>
            </div>
        </div>

        <div class="window-body">
            <main class="main-content">
                <div class="error-wrap">
                    <div class="error-icon">
                        <svg class="compass" viewBox="0 0 48 48" aria-hidden="true">
                            <circle cx="24" cy="24" r="22" fill="var(--panel)" stroke="var(--primary)" stroke-width="2"/>
                            <circle cx="24" cy="24" r="2" fill="var(--primary)"/>
                            <g stroke="var(--muted)" stroke-width="1.5">
                                <line x1="24" y1="4" x2="24" y2="9"/>
                                <line x1="24" y1="39" x2="24" y2="44"/>
                                <line x1="4" y1="24" x2="9" y2="24"/>
                                <line x1="39" y1="24" x2="44" y2="24"/>
                            </g>
                            <g class="compass-needle">
                                <polygon points="24,8 27,24 24,27 21,24" fill="var(--danger)"/>
                                <polygon points="24,40 27,24 24,22 21,24" fill="var(--primary)"/>
                            </g>
                        </svg>
                    </div>
                    <div class="error-code">404</div>
                    <h1 class="error-title">Looks like you got lost</h1>
                    <p class="error-desc">
                        The page you are looking for doesn't exist, was moved, or never was here.
                        Let's get you back on track.
                    </p>
                </div>
            </main>
        </div>
    </div>
    <script src="/js/dark-mode.js"></script>
</body>

</html>
