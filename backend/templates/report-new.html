<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="icon" type="image/png" href="/static/favicon.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Report | RH System</title>
    <link rel="stylesheet" href="/css/overview.css">
</head>

<body>
    <div class="window">
        <div class="window-header">
            <div>
                <div class="eyebrow">HR Management</div>
                <div class="window-title">Create Report</div>
            </div>
            <div class="window-status">Reports</div>
            <div class="window-controls">
                <div class="window-control"></div>
                <div class="window-control"></div>
                <div class="window-control"></div>
            </div>
        </div>

        <div class="window-body">
            <aside class="sidebar">
                <div class="nav-menu">
                    {{if .user}}
                    {{if .user.Photo}}
                    <img src="{{.user.Photo}}" class="user-photo-nav" alt="Profile photo">
                    {{else}}
                    <span class="user-photo-nav user-photo-fallback">{{slice .user.Username 0 1}}</span>
                    {{end}}
                    {{end}}

                    <a href="/dashboard" class="nav-item">
                        <span class="nav-icon">📊</span>
                        <span>Dashboard</span>
                    </a>

                    <a href="/overview" class="nav-item">
                        <span class="nav-icon">📈</span>
                        <span>Overview</span>
                    </a>

                    <a href="/employees" class="nav-item">
                        <span class="nav-icon">👥</span>
                        <span>Manage Candidates</span>
                    </a>

                    <a href="/department" class="nav-item">
                        <span class="nav-icon">🗂️</span>
                        <span>Departments</span>
                    </a>

                    <a href="/report" class="nav-item active">
                        <span class="nav-icon">📋</span>
                        <span>Report</span>
                    </a>

                    <a href="/config" class="nav-item">
                        <span class="nav-icon">⚙️</span>
                        <span>Configuration</span>
                    </a>

                    <a href="/" class="nav-item">
                        <span class="nav-icon">↩️</span>
                        <span>Return to login</span>
                    </a>
                </div>
            </aside>

            <main class="main-content">
                <section class="report-form-section">
                    <div class="section-intro">
                        <div class="eyebrow">Create report</div>
                        <h2>New Report</h2>
                    </div>

                    <form method="POST" action="/report/new" class="report-form">
                        <div class="form-group">
                            <label for="name">Report name:</label>
                            <input type="text" id="name" name="name" placeholder="e.g. Hiring Q3" required>
                        </div>

                        <div class="report-categories">
                            <div class="report-categories-title">Categories</div>
                        </div>

                        <button type="submit" class="btn btn-primary">Create Report</button>
                </form>
                </section>
            </main>
        </div>
    </div>
    <script src="/js/dark-mode.js"></script>
</body>

</html>
